[project]
name = "learning-companion-api"
version = "0.1.0"
description = "Backend API and AI engine for PractiLoop"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
